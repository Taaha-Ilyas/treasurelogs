<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treasure Logs</title>
<meta name="description" content="Treasure Logs — chop trees, craft axes and chainsaws, hunt animals, tame pets and uncover the treasure hidden in the forest.">
<meta property="og:title" content="Treasure Logs">
<meta property="og:description" content="Chop trees, craft tools, hunt animals and uncover the treasure hidden in the logs.">
<meta name="theme-color" content="#3f6f28">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233f6f28'/%3E%3Crect x='10' y='26' width='40' height='18' rx='5' fill='%23a0703f'/%3E%3Cellipse cx='50' cy='35' rx='8' ry='9' fill='%23e2c08a'/%3E%3Cellipse cx='50' cy='35' rx='4' ry='5' fill='none' stroke='%237a4a22' stroke-width='2'/%3E%3Ccircle cx='24' cy='20' r='6' fill='%23ffd34d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#16200f;font-family:Nunito,system-ui,sans-serif;color:#3a2412;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;cursor:crosshair}
.hidden{display:none!important}
.dim{opacity:.7}
small{font-size:.82em}
/* ---------- buttons ---------- */
.btn{font-family:inherit;font-weight:800;font-size:14px;color:#3a2412;background:linear-gradient(#f7dca0,#e2b56c);border:3px solid #6b3a1e;border-radius:8px;padding:6px 12px;cursor:pointer;box-shadow:0 3px 0 #6b3a1e,inset 0 2px 0 #fff4d0;white-space:nowrap;transition:transform .06s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #6b3a1e}
.btn.gold{background:linear-gradient(#ffe680,#f2b52a);}
.btn.red{background:linear-gradient(#f4a08a,#d0604a);color:#fff;text-shadow:0 1px 0 #0005}
.btn.dis{filter:grayscale(.8) brightness(.85);opacity:.6;cursor:not-allowed}
.btn.big{font-size:18px;padding:10px 22px}
.btn.sm{font-size:12px;padding:3px 8px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#hud-stats{position:absolute;left:12px;top:12px;width:290px;background:rgba(40,24,12,.82);border:3px solid #c9a26b;border-radius:12px;padding:10px 12px;color:#fff3d6;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.hs-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:14px}
.hs-row .ico{width:20px;text-align:center}
.hs-row.coins b{font-size:22px;color:#ffd34d;text-shadow:0 2px 0 #6b3a1e}
.hs-row .lvl{background:#7ad0ff;color:#123;font-weight:900;border-radius:6px;padding:1px 6px;font-size:13px;min-width:46px;text-align:center}
.bar{position:relative;flex:1;height:16px;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;transition:width .2s}
.bar em{position:absolute;inset:0;font-style:normal;font-size:11px;font-weight:800;text-align:center;line-height:15px;color:#fff;text-shadow:0 1px 2px #000}
.bar.xp i{background:linear-gradient(#9fe0ff,#3a9ad8)} .bar.hp i{background:linear-gradient(#ff8a7a,#d0302a)} .bar.st i{background:linear-gradient(#b8f07a,#5aa030)}
.bar.sm{height:14px;margin-top:4px} .bar.sm i{background:linear-gradient(#b8f07a,#5aa030)}
.hs-row.stage{align-items:flex-start} .hs-row.stage>div{flex:1} .hs-row.stage b{font-size:13px;display:block;margin-bottom:3px}
.pill{background:rgba(255,255,255,.12);border-radius:20px;padding:2px 8px;font-weight:800;font-size:13px}
.pill.acorn{cursor:pointer;background:rgba(255,211,77,.2)} .pill.acorn:hover{background:rgba(255,211,77,.35)}
.pill small{opacity:.7}
.buff.surge{background:#c0561a} .buff.frenzy{background:#2a7ab0}
.hs-row.buffs:empty{display:none}
#objective{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(40,24,12,.82);border:3px solid #c9a26b;border-radius:30px;padding:6px 18px;color:#fff3d6;font-weight:800;font-size:15px;max-width:46vw;text-align:center}
#hud-btns{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.hbtn{position:relative;width:46px;height:46px;font-size:22px;border-radius:10px;background:linear-gradient(#f7dca0,#e2b56c);border:3px solid #6b3a1e;cursor:pointer;box-shadow:0 3px 0 #6b3a1e}
.hbtn span{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:900;color:#6b3a1e}
.hbtn:hover{filter:brightness(1.08)}
#feed{position:absolute;left:12px;bottom:110px;width:380px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.feed-item{background:rgba(30,18,8,.78);color:#fff3d6;border-left:4px solid #ffd34d;padding:5px 10px;border-radius:6px;font-size:13px;font-weight:700;animation:fin .25s;transition:opacity .9s}
.feed-item.fade{opacity:0}
@keyframes fin{from{transform:translateX(-20px);opacity:0}}
#prompt{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:rgba(255,243,200,.95);border:3px solid #6b3a1e;border-radius:10px;padding:6px 14px;font-weight:900;font-size:15px;opacity:0;transition:opacity .15s;pointer-events:none}
#prompt.show{opacity:1}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(40,24,12,.82);border:3px solid #c9a26b;border-radius:12px;padding:6px}
.hb-slot{position:relative;width:76px;height:76px;background:linear-gradient(#f7dca0,#dcae66);border:3px solid #6b3a1e;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hb-slot img{width:54px;height:54px;margin-top:-10px}
.hb-slot.on{outline:3px solid #ffd34d;box-shadow:0 0 12px #ffd34d;background:linear-gradient(#fff3c0,#f2c870)}
.hb-slot .k{position:absolute;left:3px;top:1px;font-size:11px;font-weight:900;color:#6b3a1e}
.hb-slot .n{position:absolute;left:2px;right:2px;bottom:2px;font-size:10px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-slot .big{font-size:32px;margin-top:-12px}
/* ---------- banners ---------- */
#banner{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);display:flex;align-items:center;gap:12px;background:rgba(20,12,6,.9);border:3px solid #ffd34d;border-radius:14px;padding:10px 22px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:80vw;z-index:20}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner img{width:52px;height:52px;object-fit:contain}
#banner .bt{font-family:'Pixelify Sans',Nunito,sans-serif;font-size:28px;font-weight:700;letter-spacing:1px;text-shadow:0 3px 0 #000}
#banner .bs{color:#fff3d6;font-weight:700;font-size:15px}
#stagebanner{position:fixed;left:0;right:0;top:28%;display:flex;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;z-index:21}
#stagebanner.show{opacity:1}
.sb-in{background:linear-gradient(90deg,transparent,rgba(20,12,6,.92) 15%,rgba(20,12,6,.92) 85%,transparent);padding:22px 120px;text-align:center;color:#fff3d6}
.sb-k{font-family:'Pixelify Sans',sans-serif;color:#9fe870;font-size:20px;letter-spacing:4px}
.sb-t{font-family:'Pixelify Sans',sans-serif;font-size:52px;color:#ffd34d;text-shadow:0 4px 0 #5a2e10}
.sb-d{font-style:italic;margin-bottom:8px}
.sb-l{font-weight:700;font-size:15px}
/* ---------- dialogue (Stardew style) ---------- */
#dialogue{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(1000px,94vw);height:230px;display:flex;gap:10px;z-index:30;cursor:pointer}
.dlg-main,.dlg-side{background:#f2d398;border:6px solid #8a4a22;border-radius:6px;box-shadow:inset 0 0 0 4px #e0a860,inset 0 0 0 6px #b8722e,0 6px 0 rgba(0,0,0,.35)}
.dlg-main{position:relative;flex:1;padding:22px 26px}
#dlg-text{font-family:'Pixelify Sans',Nunito,sans-serif;font-size:24px;line-height:1.35;color:#3a2412;white-space:pre-wrap}
#dlg-next{position:absolute;right:18px;bottom:10px;font-size:20px;color:#8a4a22;animation:bob .7s infinite alternate}
@keyframes bob{to{transform:translateY(4px)}}
#dlg-choices{position:absolute;left:22px;right:22px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 18px}
.dc{font-family:'Pixelify Sans',sans-serif;font-size:20px;padding:2px 10px 2px 26px;border-radius:6px;position:relative;cursor:pointer;color:#5a3a1a}
.dc.on,.dc:hover{background:rgba(255,255,255,.45);color:#2a1408}
.dc .hand{position:absolute;left:4px;top:1px}
.dlg-side{width:200px;display:flex;flex-direction:column;align-items:center;padding:12px}
.dlg-pframe{border:5px solid #8a4a22;border-radius:4px;box-shadow:inset 0 0 0 2px #e0a860;line-height:0}
#dlg-portrait{width:160px;height:150px}
#dlg-name{margin-top:6px;background:#e9b670;border:4px solid #8a4a22;border-radius:6px;padding:2px 16px;font-family:'Pixelify Sans',sans-serif;font-size:22px;color:#3a2412}
/* ---------- panels ---------- */
#panel,#pause{position:fixed;inset:0;background:rgba(10,6,2,.55);display:flex;align-items:center;justify-content:center;z-index:25}
.pn-box{width:min(980px,96vw);height:min(720px,92vh);display:flex;flex-direction:column;background:#f2d398;border:6px solid #8a4a22;border-radius:10px;box-shadow:inset 0 0 0 4px #e0a860,0 10px 0 rgba(0,0,0,.35)}
.pn-head{display:flex;align-items:center;gap:14px;padding:12px 16px 6px}
.pn-title{font-family:'Pixelify Sans',sans-serif;font-size:30px;color:#5a2e10;flex:1}
.pn-coins{font-weight:900;font-size:20px;color:#7a4a10;background:#fff3c8;border:3px solid #c9a26b;border-radius:20px;padding:2px 14px}
.pn-x{width:40px;height:40px;border-radius:8px;border:3px solid #6b3a1e;background:#d0604a;color:#fff;font-weight:900;font-size:18px;cursor:pointer}
.pn-tabs{display:flex;gap:6px;padding:0 16px;flex-wrap:wrap}
.tab{font-family:inherit;font-weight:800;font-size:14px;background:#e0b878;border:3px solid #8a4a22;border-bottom:none;border-radius:8px 8px 0 0;padding:6px 12px;cursor:pointer;color:#5a2e10}
.tab.on{background:#fff3d0}
.tab.dis{opacity:.55}
.pn-body{flex:1;overflow:auto;margin:0 16px 16px;background:#fff3d0;border:3px solid #8a4a22;border-radius:0 8px 8px 8px;padding:12px}
.pn-body h3{font-family:'Pixelify Sans',sans-serif;color:#7a3a10;margin:14px 0 6px;font-size:22px}
.pn-body h3 small{font-family:Nunito;font-size:13px;opacity:.7}
.note{background:#f6e2b0;border-left:5px solid #c9a26b;padding:6px 10px;border-radius:6px;font-weight:700;font-size:13px;margin-bottom:10px}
.empty,.bigmsg{text-align:center;padding:40px 20px;font-weight:700;font-size:16px}
.bigmsg b{font-size:22px} .bigmsg p{max-width:560px;margin:10px auto}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:#fbe8bd;border:2px solid #e2c08a;margin-bottom:6px}
.row.own{background:#e8f6cc;border-color:#a8d070}
.row.lockedrow{opacity:.55}
.row.special{background:#f6e0f6;border-color:#d8a8e0}
.row.total{background:#fff1a8;border-color:#e0b830}
.ri{width:48px;height:48px;object-fit:contain;flex:none}
.ri.tree{width:56px;height:62px}
.ri.emoji{font-size:30px;text-align:center;line-height:48px}
.ri.sil,.ci.unk img,img.sil{filter:brightness(0) opacity(.45)}
.rn{flex:1;min-width:0} .rn b{display:block;font-size:15px} .rn small{display:block;color:#6a4a2a;font-weight:700}
.rv{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;font-weight:800}
.cost{display:inline-flex;align-items:center;gap:3px;background:#fff;border:2px solid #c9a26b;border-radius:14px;padding:1px 8px;font-size:13px;font-weight:800}
.cost img{width:22px;height:15px}
.cost.no{color:#c0392b;border-color:#e09080;background:#fff0ec}
.owned{color:#3a8a1a;font-weight:900} .locked{color:#8a6a4a;font-weight:800;font-size:13px} .maxed{color:#b07a00;font-weight:900}
.lv{font-size:12px;background:#c9a26b;color:#fff;border-radius:6px;padding:0 6px;margin-left:4px}
.pips{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap} .pips i{width:12px;height:6px;border-radius:3px;background:#e2c08a} .pips i.on{background:#5aa030}
.rowc{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.reqs{list-style:none;padding:0;font-weight:800} .reqs li{color:#c0392b} .reqs li.ok{color:#3a8a1a}
/* craft */
.cr-types{display:flex;gap:6px;margin-bottom:8px}
.cr-types .tab{border-radius:8px;border-bottom:3px solid #8a4a22}
.cr-main{display:flex;gap:12px}
.cr-cols{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cr-col h4{margin:0 0 6px;font-family:'Pixelify Sans',sans-serif;font-size:18px;color:#7a3a10}
.pc{display:flex;align-items:center;gap:6px;padding:4px 6px;border:2px solid #e2c08a;border-radius:8px;background:#fbe8bd;margin-bottom:4px;cursor:pointer;font-weight:800;font-size:13px}
.pc img{width:34px;height:34px}
.pc:hover{background:#fff6dc}
.pc.on{border-color:#5aa030;background:#e8f6cc;box-shadow:0 0 0 2px #5aa030}
.pc.sp{background:#f6e0f6}
.pc-more{font-size:12px;opacity:.7;font-weight:700;text-align:center}
.cr-prev{width:250px;display:flex;flex-direction:column;align-items:center;gap:8px}
#craftcv{border:4px solid #8a4a22;border-radius:8px;width:220px;height:200px}
.cr-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.cr-stats div,.stgrid div{background:#fbe8bd;border-radius:6px;padding:3px 6px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.cr-stats b,.stgrid b{color:#7a3a10}
#craftname{width:100%;font-family:inherit;font-weight:800;font-size:15px;padding:6px 8px;border:3px solid #8a4a22;border-radius:8px;background:#fff;user-select:text}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
/* tool rack */
.tool{display:flex;gap:12px;padding:10px;border:2px solid #e2c08a;background:#fbe8bd;border-radius:10px;margin-bottom:8px}
.tool.eq{border-color:#e0b830;background:#fff4c0;box-shadow:0 0 0 2px #ffd34d}
.ti{width:72px;height:72px;background:#f2d398;border-radius:8px;border:2px solid #c9a26b}
.tb{flex:1;min-width:0}
.tn b{font-size:17px} .key{display:inline-block;background:#6b3a1e;color:#fff;border-radius:4px;padding:0 6px;font-size:12px;margin-right:6px}
.eqt{color:#b07a00;font-weight:900}
.tp{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0;font-size:12px;font-weight:700}
.tp span{display:flex;align-items:center;gap:2px;background:#fff3d0;border-radius:12px;padding:0 8px 0 2px} .tp img{width:24px;height:24px}
.tsx{font-size:12px;font-weight:700;color:#6a4a2a}
.tatt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0;align-items:center;font-size:13px}
.tatt select{font-family:inherit;font-weight:700;font-size:12px;border:2px solid #c9a26b;border-radius:6px;padding:3px;background:#fff;max-width:300px}
.att{background:#fff3d0;border-radius:6px;padding:2px 8px;font-weight:700}
.tbtn{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* bestiary */
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.bc{background:#fbe8bd;border:2px solid #e2c08a;border-radius:10px;padding:8px;text-align:center;font-size:13px}
.bc.unk{background:#eadcbc}
.bc img{width:84px;height:72px}
.bn{font-weight:900;font-size:16px}
.ba{background:#fff3d0;border-radius:6px;padding:4px;margin:4px 0} .ba small{display:block;font-weight:700;color:#6a4a2a}
.roman{background:#5aa030;color:#fff;border-radius:4px;padding:0 6px;font-size:12px}
.bw{font-size:11px;color:#7a5a3a;margin-top:4px;font-weight:700}
.coll{display:flex;flex-wrap:wrap;gap:6px}
.ci{width:60px;height:60px;border:2px solid #c9a26b;border-radius:8px;background:#fbe8bd;display:flex;align-items:center;justify-content:center}
.ci.sp{background:#f6e0f6} .ci.emoji{font-size:28px} .ci.emoji.unk{filter:grayscale(1) opacity(.4)}
.ci img{width:50px;height:50px}
.tog{display:flex;align-items:center;gap:6px;font-weight:900;cursor:pointer} .tog input{width:22px;height:22px;accent-color:#5aa030}
/* pause */
.pz-box{background:#f2d398;border:6px solid #8a4a22;border-radius:12px;padding:20px 40px;display:flex;flex-direction:column;gap:10px;align-items:stretch;box-shadow:inset 0 0 0 4px #e0a860;text-align:center}
.pz-box h2{font-family:'Pixelify Sans',sans-serif;font-size:36px;margin:0 0 6px;color:#5a2e10}
/* tooltip */
#tip{position:fixed;z-index:60;background:rgba(20,12,6,.95);color:#fff3d6;border:2px solid #c9a26b;border-radius:8px;padding:6px 10px;font-size:13px;max-width:260px;pointer-events:none;opacity:0}
#tip.show{opacity:1} #tip b{color:#ffd34d}
/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:40}
.logo{text-align:center;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.lg1,.lg2{font-family:'Pixelify Sans',Nunito,sans-serif;font-weight:700;line-height:.9;-webkit-text-stroke:3px #5a2e10}
.lg1{font-size:clamp(48px,10vw,110px);color:#ffd34d}
.lg2{font-size:clamp(56px,12vw,140px);color:#e8b06a;letter-spacing:6px}
.lgsub{display:inline-block;margin-top:8px;background:rgba(40,24,12,.8);color:#fff3d6;border-radius:20px;padding:4px 16px;font-weight:800}
.tmenu{display:flex;flex-direction:column;gap:10px;min-width:260px}
.tmenu.trow{flex-direction:row;justify-content:center}
.tfoot{color:#fff3d6;font-weight:700;text-shadow:0 1px 2px #000;opacity:.85}
.slots{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.slot{position:relative;width:250px;min-height:230px;background:#f2d398;border:6px solid #8a4a22;border-radius:12px;padding:14px;cursor:pointer;box-shadow:inset 0 0 0 3px #e0a860,0 6px 0 rgba(0,0,0,.35);text-align:center;transition:transform .1s}
.slot:hover{transform:translateY(-4px)}
.slot.empty{display:flex;flex-direction:column;justify-content:center;background:#e8c890}
.sl-n{font-family:'Pixelify Sans',sans-serif;font-size:24px;color:#5a2e10}
.sl-e{font-size:24px;font-weight:900;margin:10px}
.sl-tool{width:64px;height:64px}
.sl-st{font-weight:900;color:#2f6a1f}
.sl-row{font-weight:700;font-size:14px;margin-top:3px}
.sl-del{position:absolute;right:8px;top:8px}
.helpbox{background:#f2d398;border:6px solid #8a4a22;border-radius:12px;padding:16px 24px;max-width:620px;box-shadow:inset 0 0 0 3px #e0a860}
.helpbox h3{font-family:'Pixelify Sans',sans-serif;font-size:26px;margin:0;color:#5a2e10}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px;margin-top:8px}
.ctrl div{display:flex;align-items:center;gap:8px;font-weight:700}
kbd{background:#fff;border:2px solid #8a4a22;border-bottom-width:4px;border-radius:6px;padding:1px 8px;font-family:inherit;font-weight:900;font-size:13px;white-space:nowrap}
/* ---------- cinematic ---------- */
#cine{position:fixed;inset:0;z-index:50;background:#000;cursor:pointer}
#cinecv{width:100%;height:100%;display:block}
#cine-text{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:min(900px,90vw);text-align:center;color:#fff3d6;font-family:'Pixelify Sans',Nunito,sans-serif;font-size:clamp(20px,2.6vw,30px);text-shadow:0 3px 0 #000,0 0 12px #000;min-height:2.6em}
#cine-skip{position:absolute;right:20px;top:20px}
.cine-hint{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);color:#fff9;font-size:13px;font-weight:700}
/* ---------- patch notes ---------- */

.ovi{display:flex;gap:10px;background:#2a2e37;border-radius:8px;padding:8px 12px;cursor:pointer;color:#d8dce4;text-decoration:none;border-left:4px solid #55ff55}

.pn-wrap section{margin-top:26px}

  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v * (1+amt) : v + (255-v)*amt)));

}

// ---------------- SAVE STATE ----------------
function newSaveData(slot) {
  return {
    v: 1, slot, created: Date.now(), saved: Date.now(), playTime: 0, introSeen: false,
    coins: 0, xp: 0, level: 1, stage: 1, chopped: 0, hunted: 0, quest: 0,

}
function lvlOf(id) { return S.upg[id] || 0; }

// ---------------- STATS ----------------
function abilityLevel(id) { const c = S.best[id] || 0; let l = 0; for (const t of ABILITY_TIERS) if (c >= t) l++; return l; }
function currentTool() { return S.tools.find(t => t.uid === S.equipped) || null; }
function toolStats(tool) {
  const st = { power: 0, hard: 0, interval: 0.75, reach: 62, crit: 0, critDmg: 0, yield: 0, xp: 0, value: 0, dmg: 0, speed: 0, event: 0, huntDmg: 0, move: 0, acorn: 0, petDmg: 0 };
  if (!tool) return st;
  const add = (o) => { if (!o) return; for (const k in o) if (k in st && k !== 'power') st[k] += o[k]; };
  if (tool.type === 'axe') {
    const h = PART[tool.parts.handle], b = PART[tool.parts.blade], r = PART[tool.parts.binder];
    st.power = b.power; st.hard = b.hard; st.interval = 0.75 / h.speed; st.reach = 62 * h.reach;
    st.crit += r.crit || 0; st.yield += r.yield || 0; st.xp += r.xp || 0; st.critDmg += r.critDmg || 0;
    add(h.fx); add(b.fx); add(r.fx);
  } else {
    const e = PART[tool.parts.engine], b = PART[tool.parts.bar], c = PART[tool.parts.chain];
    st.power = b.power * 0.15 / 0.15; st.hard = b.hard; st.interval = 0.15 / e.rpm; st.reach = 70;
    st.crit += c.crit || 0; st.yield += c.yield || 0;
    add(e.fx); add(b.fx); add(c.fx);
  }
  st.dmg += (tool.sharpen || 0) * 0.08; st.speed += (tool.balance || 0) * 0.04;
  (tool.att || []).forEach(a => { if (ATT[a]) add(ATT[a].stats); });
  return st;
}
function calcStats() {
  const tool = currentTool(); const ts = toolStats(tool);
  const s = {
    power: ts.power, hard: ts.hard, reach: ts.reach, tool,
    dmg: 1 + ts.dmg + (S.level - 1) * 0.02, speed: 1 + ts.speed, crit: ts.crit, critDmg: 2 + ts.critDmg,
    yield: 1 + ts.yield, value: 1 + ts.value + lvlOf('haggle') * 0.05, xp: 1 + ts.xp, event: 1 + ts.event + lvlOf('luck') * 0.08,
    acorn: 1 + ts.acorn + lvlOf('acorns') * 0.15, huntDmg: 1 + ts.huntDmg + (S.level - 1) * 0.02, move: 1 + ts.move + lvlOf('boots') * 0.05,
    petDmg: 1 + ts.petDmg, animal: 1 + lvlOf('keenEye') * 0.1, respawn: lvlOf('respawn') * 0.5, armor: 0, luck: 1, maxHp: 100 + lvlOf('vitality') * 20,
  };
  for (const a of ANIMALS) {
    const l = abilityLevel(a.id); if (!l) continue; const v = a.per * l;
    if (a.stat === 'armor') s.armor += v; else if (a.stat === 'respawn') s.respawn += v; else if (a.stat === 'crit') s.crit += v; else if (a.stat === 'critDmg') s.critDmg += v; else s[a.stat] += v;
  }
  s.armor = Math.min(0.6, s.armor);
  s.interval = ts.interval / s.speed;
  s.respawnTime = Math.max(3, BASE_RESPAWN - s.respawn);
  s.maxTrees = 1 + lvlOf('maxTrees');
  s.toolSlots = 3 + lvlOf('toolRack') * 2;
  s.petSlots = 1 + lvlOf('kennel');
  ST = s;
  if (W && W.player) W.player.hp = Math.min(W.player.hp, s.maxHp);
  return s;
}

// ---------------- WORLD ----------------
function inPond(x, y, pad) { pad = pad || 0; return PONDS.some(p => ((x - p.x) ** 2) / ((p.rx + pad) ** 2) + ((y - p.y) ** 2) / ((p.ry + pad) ** 2) < 1); }
function inCamp(x, y, pad) { pad = pad || 0; return ((x - CAMP.x) ** 2) / ((CAMP.rx + pad) ** 2) + ((y - CAMP.y) ** 2) / ((CAMP.ry + pad) ** 2) < 1; }
function buildingCol(b) { return { x: b.x + 4, y: b.y + b.h * 0.5, w: b.w - 8, h: b.h * 0.5 }; }

function initWorld() {
  W = {
    time: 0, trees: [], pending: [], stumps: [], animals: [], pets: [], acorns: [], chests: [], parts: [], floaters: [], ambient: [],
    buffs: {}, acornTimer: 12, nextGolden: false, saveTimer: 30, ground: null, groundStage: 0, shake: 0,
    player: { x: S.pos.x, y: S.pos.y, facing: 1, walk: 0, moving: false, swingT: 0, cd: 0, hp: 100, hurtT: 0, lastHurt: 99, target: null, tooHardT: 0 },
  };
  calcStats(); W.player.hp = ST.maxHp;
  buildGround();

// ---------------- HELPERS ----------------

// ---------------- UPDATE ----------------
function update(dt) {
  W.time += dt; S.playTime += dt;
  if (UI.isBlocking()) { W.parts.length && updateParticles(dt); return; }
  const p = W.player;
  // movement
  let mx = 0, my = 0;
  if (keys['KeyW'] || keys['ArrowUp']) my -= 1; if (keys['KeyS'] || keys['ArrowDown']) my += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1; if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  const len = Math.hypot(mx, my);
  p.moving = len > 0;
  if (len) {
    const sp = 215 * ST.move;
    mx /= len; my /= len; p.facing = mx > 0 ? 1 : mx < 0 ? -1 : p.facing; p.walk += dt * 12;
    moveWithCollision(p, mx * sp * dt, my * sp * dt);
  }
  if (mouse.down || keys['Space']) { if (mouse.down && !len) p.facing = mouse.wx >= p.x ? 1 : -1; tryAttack(); }
  p.cd -= dt; p.swingT = Math.max(0, p.swingT - dt * 4); p.hurtT -= dt; p.lastHurt += dt; p.tooHardT -= dt;
  if (p.lastHurt > 4 && p.hp < ST.maxHp) p.hp = Math.min(ST.maxHp, p.hp + ST.maxHp * 0.05 * dt);
  for (const k in W.buffs) W.buffs[k] = Math.max(0, W.buffs[k] - dt);
  // trees
  for (const t of W.trees) { t.shake = Math.max(0, t.shake - dt); t.flash = Math.max(0, t.flash - dt); }
  for (let i = W.pending.length - 1; i >= 0; i--) {
    const pd = W.pending[i]; pd.t -= dt;
    if (pd.t <= 0) {
      if (Math.hypot(pd.x - p.x, (pd.y - p.y) * 1.6) < 50 || W.animals.some(a => Math.hypot(a.x - pd.x, a.y - pd.y) < 20)) { pd.t = 0.3; continue; }
      W.pending.splice(i, 1);
      if (W.trees.length < ST.maxTrees) { W.trees.push(makeTree(pd.id, pd.x, pd.y, pd.golden)); burst(pd.x, pd.y - 30, TREE[pd.id].leaves, 12, { type: 'leaf', g: 60, z: 40 }); if (pd.golden) burst(pd.x, pd.y - 40, ['#ffd34d', '#fff'], 18, { type: 'spark', g: 40 }); }
    }

  while (W.trees.length + W.pending.length < ST.maxTrees) { const pos = randomTreeSpot(); W.pending.push({ x: pos.x, y: pos.y, t: 1.5, total: 1.5, id: pickVariant(), golden: false }); }
  for (let i = W.stumps.length - 1; i >= 0; i--) { W.stumps[i].life -= dt; if (W.stumps[i].life <= 0) W.stumps.splice(i, 1); }

  W.hudT = (W.hudT || 0) - dt; if (W.hudT <= 0) { W.hudT = 0.25; UI.refreshHUD(); }
}
function moveWithCollision(p, dx, dy) {

    if (inPond(x, y, 0)) return true;
    for (const b of BUILDINGS) { const c = buildingCol(b); if (x > c.x && x < c.x + c.w && y > c.y && y < c.y + c.h) return true; }
    for (const t of W.trees) if ((t.x - x) ** 2 + ((t.y - y) * 1.6) ** 2 < (t.r + 8) ** 2) return true;

}
function getInteractable() {
  const p = W.player; let best = null, bd = 80;
  for (const n of NPCS) { const d = Math.hypot(n.x - p.x, n.y - p.y); if (d < bd) { bd = d; best = { kind: 'npc', o: n, label: `[E] Talk to ${n.name}` }; } }
  const b = BUILDINGS.find(b => b.id === 'board'); const bdd = Math.hypot(b.x + b.w / 2 - p.x, b.y + b.h - p.y);
  if (bdd < Math.min(bd, 70)) { best = { kind: 'board', label: '[E] Read the Notice Board (Patch Notes)' }; bd = bdd; }
  const an = W.animals.find(a => ANIMAL[a.sp].tame && dist(a, p) < 75);

}
function interact() {

  if (it.kind === 'npc') UI.talk(it.o.id);
  else if (it.kind === 'board') UI.openPatchNotes();

// ---------------- PARTICLES ----------------
function updateParticles(dt) {
  for (let i = W.parts.length - 1; i >= 0; i--) {
    const q = W.parts[i]; q.life -= dt; if (q.life <= 0) { W.parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vz -= q.g * dt; q.z += q.vz * dt; if (q.z < 0) { q.z = 0; q.vz *= -0.3; q.vx *= 0.6; q.vy *= 0.6; }

    W.ambient.push({ x: Math.random() * VIEW.w, y: -10, vx: rand(-20, 20), vy: rand(20, 60), life: 12, type: types[deco] || 'leaf', ph: rand(0, 6) });
    if (types[deco] === 'firefly' || types[deco] === 'ember' || types[deco] === 'spore') { const a = W.ambient[W.ambient.length - 1]; a.y = rand(0, VIEW.h); a.vy = types[deco] === 'ember' ? rand(-40, -15) : rand(-10, 10); }
  }
  for (let i = W.ambient.length - 1; i >= 0; i--) { const a = W.ambient[i]; a.life -= dt; a.x += (a.vx + Math.sin(W.time * 2 + a.ph) * 15) * dt; a.y += a.vy * dt; if (a.life <= 0 || a.y > VIEW.h + 20 || a.y < -30) W.ambient.splice(i, 1); }
}

// ---------------- RENDER ----------------
function render() {

  if (vw > WORLD_W) cam.x = (WORLD_W - vw) / 2; if (vh > WORLD_H) cam.y = (WORLD_H - vh) / 2;

  ctx.fillStyle = '#1e2a16'; ctx.fillRect(0, 0, VIEW.w, VIEW.h);

  { const gx = Math.max(0, cam.x - 10), gy = Math.max(0, cam.y - 10), gw = Math.min(WORLD_W - gx, vw + 20), gh = Math.min(WORLD_H - gy, vh + 20); ctx.drawImage(W.ground, gx, gy, gw, gh, gx, gy, gw, gh); }

  list.sort((a, b) => a.y - b.y).forEach(o => o.f());

const SFX = (() => {

  const noise = (d, v, f) => { const a = ensure(); if (!a || SFX.muted) return; const b = a.createBuffer(1, a.sampleRate * d, a.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length); const s = a.createBufferSource(); s.buffer = b; const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = f || 1200; const g = a.createGain(); g.gain.value = (v || 0.2) * vol; s.connect(fl); fl.connect(g); g.connect(a.destination); s.start(); };
  let lastChop = 0;

    muted: false, ensure,

      const c = S.best[a.id] || 0, l = abilityLevel(a.id), known = c > 0;
      const next = ABILITY_TIERS[l]; const prev = l ? ABILITY_TIERS[l - 1] : 0;
      const where = TREES.filter(t => t.animals.includes(a.id)).map(t => t.name).join(', ') || 'Any tree (very rare)';
      return `<div class="bc ${known ? '' : 'unk'}"><img src="${animalIcon(a.id, !known)}"><div class="bn">${known ? esc(a.name) : '???'} ${a.tame ? '<span title="Tameable">🐾</span>' : ''}${a.beh === 'aggro' ? '<span title="Fights back">⚔</span>' : ''}</div>

  // ---- Pets
  TABS.pets = () => {
    if (!S.pets.length) return `<div class="empty">No pets yet! Animals with a 🐾 can be tamed — buy Treats from Pip, then press <b>F</b> next to the animal. Weakening it first helps.</div>`;
    return `<div class="note">Active pets follow you and chop nearby trees. Active slots: <b>${S.activePets.length}/${ST.petSlots}</b> (more from Pip's Pet Kennel).</div>` + S.pets.map(p => {
      const a = ANIMAL[p.sp], r = RARITIES.find(x => x.id === p.rar), on = S.activePets.includes(p.uid);
      return `<div class="row ${on ? 'own' : ''}"><img class="ri" src="${animalIcon(p.sp)}"><div class="rn"><b style="color:${r.color};text-shadow:0 1px 0 #0006">${r.name} ${esc(p.name)}</b><small>Level ${p.lvl} · ${fmt(petDps(p))} chop damage/sec · XP ${p.xp}/${p.lvl * 6}</small></div>
        ${on ? `<button class="btn" data-act="petOff" data-uid="${p.uid}">Send to Lodge</button>` : `<button class="btn ${S.activePets.length < ST.petSlots ? '' : 'dis'}" data-act="petOn" data-uid="${p.uid}">Bring Along</button>`}<button class="btn red" data-act="petRelease" data-uid="${p.uid}">Release</button></div>`;
    }).join('');
  };
  // ---- Inventory
  TABS.logs = () => { const rows = TREES.filter(t => S.logs[t.id] > 0); return rows.length ? rows.map(t => `<div class="row"><img class="ri" src="${logIcon(t.id)}"><div class="rn"><b>${t.name} Logs</b><small>Worth ${fmt(t.value * ST.value)} each at Pip's</small></div><div class="rv"><b>× ${fmt(S.logs[t.id])}</b></div></div>`).join('') : '<div class="empty">No logs. Chop, chop!</div>'; };
  TABS.coll = () => Object.keys(PARTS).filter(s => S.mechanic || ['handle', 'blade', 'binder'].includes(s)).map(slot => `<h3>${SLOT_PLURAL[slot]} <small>${PARTS[slot].filter(p => S.parts[p.id]).length}/${PARTS[slot].length}</small></h3><div class="coll">${PARTS[slot].map(p => `<div class="ci ${S.parts[p.id] ? '' : 'unk'} ${p.special ? 'sp' : ''}" data-tip="${esc((S.parts[p.id] ? p.name : '???') + '|' + (S.parts[p.id] ? partStatLine(p) : p.special ? 'Rare drop: ' + TREE[p.src].name : 'Tier ' + p.tier) + (p.desc && S.parts[p.id] ? '|' + p.desc : ''))}"><img src="${partIcon(p.id)}"></div>`).join('')}</div>`).join('') + `<h3>Attachments <small>${Object.keys(S.atts).length}/${ATTACHMENTS.length}</small></h3><div class="coll">${ATTACHMENTS.map(a => `<div class="ci emoji ${S.atts[a.id] ? '' : 'unk'}" data-tip="${esc(a.name + '|' + a.desc)}">${attEmoji(a)}</div>`).join('')}</div>`;
  TABS.stats = () => { const s = ST; const pc = v => `+${Math.round((v - 1) * 100)}%`;
    const items = [['Tool power', s.power], ['Blade hardness', s.hard], ['Damage', pc(s.dmg)], ['Swing speed', pc(s.speed)], ['Crit chance', Math.round(s.crit * 100) + '%'], ['Crit damage', '×' + s.critDmg.toFixed(2)], ['Log yield', pc(s.yield)], ['Log value', pc(s.value)], ['XP gain', pc(s.xp)], ['Event chance', pc(s.event)], ['Rare drop luck', pc(s.luck)], ['Hunting damage', pc(s.huntDmg)], ['Animal chance', pc(s.animal)], ['Move speed', pc(s.move)], ['Acorn spawns', pc(s.acorn)], ['Pet damage', pc(s.petDmg)], ['Damage taken', '-' + Math.round(s.armor * 100) + '%'], ['Respawn time', s.respawnTime.toFixed(1) + 's'], ['Max trees', s.maxTrees], ['Max health', s.maxHp]];
    const st = S.stats;
    const life = [['Trees chopped', S.chopped], ['Logs cut', st.logsCut], ['Animals hunted', S.hunted], ['Pets tamed', st.tamed], ['Coins earned', fmt(st.coinsEarned)], ['Random events', st.events], ['Chests opened', st.chests], ['Rare parts found', st.partsFound], ['Golden trees', st.golden], ['Play time', Math.floor(S.playTime / 3600) + 'h ' + Math.floor(S.playTime % 3600 / 60) + 'm']];
    return `<h3>Your stats</h3><div class="stgrid">${items.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div><h3>Lifetime</h3><div class="stgrid">${life.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`; };

  // ---------- ACTIONS ----------
  const ACT = {
    close: () => closePanel(),
    tab: (d) => { panel.tab = d.tab; if (d.tab === 'craft') resetCraft(); renderPanel(); SFX.blip(); },
    useAcorn: () => useAcorn(),
    openInv: () => openPanel('inv', 'logs'),
    sell: (d) => { const v = Math.floor(S.logs[d.id] * TREE[d.id].value * ST.value); addCoins(v); S.logs[d.id] = 0; SFX.coins(); afterSell(v); },
    sellAll: () => { let v = 0; for (const k in S.logs) { v += Math.floor(S.logs[k] * TREE[k].value * ST.value); S.logs[k] = 0; } addCoins(v); SFX.coins(); afterSell(v); },
    upg: (d) => { const u = UPG[d.id], l = lvlOf(d.id), c = upgCost(u, l); if (l >= u.max || S.coins < c) return; S.coins -= c; S.upg[d.id] = l + 1; calcStats(); SFX.buy(); feed(`⬆ ${u.name} upgraded to level ${l + 1}!`); if (d.id === 'maxTrees' && S.quest === 3) advanceQuest(4); if (d.id === 'kennel') syncPets(); rerender(); },
    buyPart: (d) => { const p = PART[d.id]; if (!canAfford(p.cost, p.logs)) return; pay(p.cost, p.logs); S.parts[p.id] = true; SFX.buy(); banner('NEW PART!', `${p.name} added to your collection`, '#7ad0ff', partIcon(p.id)); rerender(); },
    treat: (d) => { const n = +d.n, c = TREAT_COST(S.stage) * n; if (S.coins < c) return; S.coins -= c; S.treats += n; SFX.buy(); rerender(); },
    buyAcorn: () => { const c = TREAT_COST(S.stage) * 3; if (S.coins < c || S.acorns >= 10) return; S.coins -= c; S.acorns++; SFX.buy(); rerender(); },
    buyAtt: (d) => { const a = ATT[d.id]; if (S.coins < a.cost) return; S.coins -= a.cost; S.atts[a.id] = true; SFX.buy(); banner('NEW ATTACHMENT!', `${a.name} — fit it in the Tool Rack`, '#7ad0ff'); rerender(); },
    buildMech: () => { if (S.level < MECHANIC.level || S.stage < MECHANIC.stage || !canAfford(MECHANIC.cost, MECHANIC.logs)) return; pay(MECHANIC.cost, MECHANIC.logs); S.mechanic = true; ['e_sputter', 's_short', 'c_basic'].forEach(id => S.parts[id] = true); SFX.rare(); banner("MECHANIC'S BENCH BUILT!", 'Chainsaws unlocked — craft one at the Workbench!', '#ffb030'); rerender(); },
    craftType: (d) => { if (d.t === 'chainsaw' && !S.mechanic) { feed('🔒 Build the Mechanic\'s Bench to craft chainsaws.'); return; } craftSel.type = d.t; resetCraft(); renderPanel(); },
    pick: (d) => { craftSel.parts[d.slot] = d.id; if (!craftSel.custom) craftSel.name = defaultName(); renderPanel(); SFX.blip(); },
    craft: () => {
      if (S.tools.length >= ST.toolSlots) { feed('Your Tool Rack is full. Dismantle a tool or buy a Bigger Tool Rack from Pip.'); return; }
      const name = ($('#craftname').value || defaultName()).trim().slice(0, 22);
      const t = { uid: S.nextUid++, name, type: craftSel.type, parts: Object.assign({}, craftSel.parts), sharpen: 0, balance: 0, att: [] };
      S.tools.push(t); S.equipped = t.uid; calcStats(); SFX.rare();
      banner('TOOL CRAFTED!', `${name} is now equipped`, '#ffd34d', toolIcon(t));
      if (S.quest === 5) advanceQuest(6);
      panel.tab = 'rack'; rerender();
    },
    equip: (d) => { S.equipped = +d.uid; calcStats(); SFX.blip(); rerender(); },
    rename: (d) => { const t = S.tools.find(x => x.uid === +d.uid); const n = prompt('Name your tool:', t.name); if (n && n.trim()) { t.name = n.trim().slice(0, 22); rerender(); } },
    dismantle: (d) => { const t = S.tools.find(x => x.uid === +d.uid); if (!confirm(`Dismantle "${t.name}"? Its parts stay in your collection, but sharpening and balance levels are lost.`)) return; S.tools = S.tools.filter(x => x !== t); if (S.equipped === t.uid) S.equipped = S.tools[0].uid; calcStats(); rerender(); },
    sharpen: (d) => { const t = S.tools.find(x => x.uid === +d.uid), c = upgCostFor(t, 'sharpen'); if (S.coins < c || t.sharpen >= 10) return; S.coins -= c; t.sharpen++; calcStats(); SFX.buy(); rerender(); },
    balance: (d) => { const t = S.tools.find(x => x.uid === +d.uid), c = upgCostFor(t, 'balance'); if (S.coins < c || t.balance >= 10) return; S.coins -= c; t.balance++; calcStats(); SFX.buy(); rerender(); },
    permit: (d) => { const t = TREE[d.id]; if (S.coins < t.permit) return; S.coins -= t.permit; S.permits[t.id] = true; S.active[t.id] = true; SFX.buy(); banner('PERMIT GRANTED!', `${t.name} trees will now grow in your forest`, '#9fe870', treeIcon(t.id)); rerender(); },
    petOn: (d) => { if (S.activePets.length >= ST.petSlots) return; S.activePets.push(+d.uid); syncPets(); rerender(); },
    petOff: (d) => { S.activePets = S.activePets.filter(u => u !== +d.uid); syncPets(); rerender(); },
    petRelease: (d) => { const p = S.pets.find(x => x.uid === +d.uid); if (!confirm(`Release your ${p.name} back into the wild?`)) return; S.pets = S.pets.filter(x => x !== p); S.activePets = S.activePets.filter(u => u !== p.uid); syncPets(); rerender(); },
  };
  function afterSell(v) { feed(`💰 Sold logs for ${fmt(v)} coins!`); if (S.quest === 2) advanceQuest(3); rerender(); }

  // ---------- TOOLTIP ----------
  function showTip(el, e) { const [t, a, b] = el.dataset.tip.split('|'); const tip = $('#tip'); tip.innerHTML = `<b>${esc(t)}</b>${a ? `<div>${esc(a)}</div>` : ''}${b ? `<div class="dim">${esc(b)}</div>` : ''}`; tip.classList.add('show'); moveTip(e); }
  function moveTip(e) { const tip = $('#tip'); tip.style.left = Math.min(innerWidth - tip.offsetWidth - 10, e.clientX + 14) + 'px'; tip.style.top = Math.min(innerHeight - tip.offsetHeight - 10, e.clientY + 14) + 'px'; }
  function hideTip() { $('#tip').classList.remove('show'); }

  // ---------- PAUSE ----------
  function togglePause(force) {
    paused = force !== undefined ? force : !paused;
    const el = $('#pause'); el.classList.toggle('hidden', !paused);
    if (paused) el.innerHTML = `<div class="pz-box"><h2>Paused</h2>
      <button class="btn big" data-pz="resume">Resume</button>
      <button class="btn big" data-pz="save">Save Game</button>
      <button class="btn big" data-pz="notes">Patch Notes</button>
      <button class="btn big" data-pz="help">Controls</button>
      <button class="btn big" data-pz="mute">${SFX.muted ? '🔇 Sound: Off' : '🔊 Sound: On'}</button>
      <button class="btn big red" data-pz="quit">Save & Quit to Title</button>
      <div class="dim">Slot ${S.slot} · autosaves every 30 seconds</div></div>`;
  }
  function showHelp() {
    dialogue({ who: 'smith', name: 'Hilda', pages: [
      'WASD / Arrows to walk. Click (or hold) the mouse or hold SPACE to chop the nearest tree or hit an animal.',
      'E talks to people and reads the notice board. F offers a treat to tameable animals 🐾. R uses a Growth Acorn.',
      '1–5 swap tools. I opens your inventory, B the Bestiary, P your pets, T your Tool Rack. ESC pauses the game.',
    ] });
  }

  // ---------- INPUT WIRING ----------
  function init() {
    document.addEventListener('click', (e) => {
      const ci = e.target.closest('[data-ci]'); if (ci && dlg) { pickChoice(+ci.dataset.ci); return; }
      if (e.target.closest('#dialogue') && dlg) { advanceDlg(); return; }
      const pz = e.target.closest('[data-pz]');
      if (pz) { const k = pz.dataset.pz;
        if (k === 'resume') togglePause(false);
        if (k === 'save') { Save.write(); togglePause(false); }
        if (k === 'notes') { togglePause(false); openPatchNotes(); }
        if (k === 'help') { togglePause(false); showHelp(); }
        if (k === 'mute') { SFX.muted = !SFX.muted; togglePause(true); }
        if (k === 'quit') { Save.write(true); togglePause(false); closePanel(); clearBanners(); Title.show(); }
        return; }
      const a = e.target.closest('[data-act]');
      if (a && a.tagName !== 'SELECT' && a.tagName !== 'INPUT' && ACT[a.dataset.act]) { ACT[a.dataset.act](a.dataset); }
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.act === 'att') { const t = S.tools.find(x => x.uid === +el.dataset.uid); t.att[+el.dataset.k] = el.value || null; t.att = t.att.map(x => x || null); while (t.att.length && !t.att[t.att.length - 1]) t.att.pop(); calcStats(); SFX.blip(); rerender(); }
      if (el.dataset.act === 'toggleTree') { const on = el.checked; const count = Object.keys(S.active).filter(k => S.active[k]).length; if (!on && count <= 1) { el.checked = true; feed('At least one tree type must be growing!'); return; } S.active[el.dataset.id] = on; rerender(); }
    });
    document.addEventListener('input', (e) => { if (e.target.id === 'craftname') { craftSel.name = e.target.value; craftSel.custom = !!e.target.value; } });
    document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-tip]'); if (t) showTip(t, e); });
    document.addEventListener('mousemove', (e) => { if ($('#tip').classList.contains('show')) { if (!e.target.closest('[data-tip]')) hideTip(); else moveTip(e); } });
  }
  function onKey(e) {
    if (Cine.active) { if (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter') Cine.next(e.code === 'Escape'); return true; }
    if (Notes.open) { if (e.code === 'Escape') Notes.close(); return true; }
    if (e.target && (e.target.tagName === 'INPUT')) { if (e.code === 'Escape') e.target.blur(); return true; }
    if (dlg) {
      if (['KeyE', 'Space', 'Enter'].includes(e.code)) advanceDlg();
      else if (e.code === 'Escape') { if (dlg.choices && dlg.page >= dlg.pages.length - 1) closeDlg(); else advanceDlg(); }
      else if (dlg.choices && (e.code === 'ArrowDown' || e.code === 'KeyS')) { dlg.choiceIdx = (dlg.choiceIdx + 1) % dlg.choices.length; renderDlg(); }
      else if (dlg.choices && (e.code === 'ArrowUp' || e.code === 'KeyW')) { dlg.choiceIdx = (dlg.choiceIdx - 1 + dlg.choices.length) % dlg.choices.length; renderDlg(); }
      return true;
    }
    if (panel) { if (e.code === 'Escape' || (e.code === 'KeyI' && panel.npc === 'inv')) closePanel(); return true; }
    if (paused) { if (e.code === 'Escape') togglePause(false); return true; }
    if (e.code === 'Escape') { togglePause(true); return true; }
    if (e.code === 'KeyE') { interact(); return true; }
    if (e.code === 'KeyF') { tryTame(); return true; }
    if (e.code === 'KeyR') { useAcorn(); return true; }
    if (e.code === 'KeyI') { openPanel('inv', 'logs'); return true; }
    if (e.code === 'KeyB') { openPanel('inv', 'best'); return true; }
    if (e.code === 'KeyP') { openPanel('inv', 'pets'); return true; }
    if (e.code === 'KeyT') { openPanel('inv', 'rack'); return true; }
    if (e.code === 'KeyN') { openPatchNotes(); return true; }
    if (/^Digit[1-5]$/.test(e.code)) { const t = S.tools[+e.code.slice(5) - 1]; if (t) { S.equipped = t.uid; calcStats(); refreshHUD(); feed(`Equipped ${t.name}`); } return true; }
    return false;
  }
  function openPatchNotes() { S && (S.seenNotes = true); Notes.show(); }

  return {
    init, clearBanners, refreshHUD, updatePrompt, feed, banner, tickBanners, stageBanner, talk, dialogue, tickDialogue, openPanel, closePanel, onKey, togglePause, openPatchNotes, showHelp,
    isBlocking: () => !!(dlg || panel || paused || Cine.active || Notes.open || Title.open),
    get dlg() { return dlg; }, get panel() { return panel; },
  };
})();

// ================= TREASURE LOGS — SAVES, TITLE, CINEMATIC, PATCH NOTES =================
const Save = {
  SLOTS: 3,
  key: n => 'treasureLogs.slot' + n,
  read(n) { try { const r = localStorage.getItem(this.key(n)); return r ? JSON.parse(r) : null; } catch (e) { return null; } },
  write(silent) {
    if (!S) return;
    S.saved = Date.now();
    try { localStorage.setItem(this.key(S.slot), JSON.stringify(S)); if (!silent) UI.feed('💾 Game saved to Slot ' + S.slot); }
    catch (e) { UI.feed('⚠ Could not save — browser storage is unavailable.'); }
  },
  del(n) { try { localStorage.removeItem(this.key(n)); } catch (e) {} },
};
function migrate(d) {
  const base = newSaveData(d.slot);
  for (const k in base) if (d[k] === undefined) d[k] = base[k];
  for (const k in base.stats) if (d.stats[k] === undefined) d.stats[k] = 0;
  return d;
}

// ---------------- TITLE ----------------
const Title = {
  open: false, view: 'main',
  show() {
    this.open = true; GAME_RUNNING = false; this.view = 'main';
    $('#hud').classList.add('hidden'); $('#title').classList.remove('hidden'); this.render();
  },
  hide() { this.open = false; $('#title').classList.add('hidden'); },
  render() {
    const el = $('#title');
    const logo = `<div class="logo"><div class="lg1">TREASURE</div><div class="lg2">LOGS</div><div class="lgsub">${GAME_VERSION} · The First Swing</div></div>`;
    if (this.view === 'main') {
      el.innerHTML = `${logo}<div class="tmenu"><button class="btn big gold" data-t="play">▶ Play</button><button class="btn big" data-t="notes">📰 Patch Notes</button><button class="btn big" data-t="help">🎮 How to Play</button></div><div class="tfoot">Made for Taaha's Arcade · Saves are stored in this browser</div>`;
    } else if (this.view === 'help') {
      const rows = [['WASD / Arrows', 'Walk around the forest'], ['Click / hold Space', 'Chop the nearest tree or hit an animal'], ['E', 'Talk to people, read the Notice Board'], ['F', 'Offer a treat to a 🐾 animal to tame it'], ['R', 'Use a Growth Acorn (speeds up respawns)'], ['1–5', 'Swap between saved tools'], ['I / B / P / T', 'Inventory, Bestiary, Pets, Tool Rack'], ['N', 'Patch notes'], ['Esc', 'Pause, save and quit']];
      el.innerHTML = `${logo}<div class="helpbox"><h3>How to Play</h3><p>Chop trees for logs, sell them to Pip, and spend coins on better tool parts, permits for new trees and upgrades. Chop enough trees to unlock new stages of the forest!</p><div class="ctrl">${rows.map(([k, v]) => `<div><kbd>${k}</kbd><span>${v}</span></div>`).join('')}</div></div><div class="tmenu trow"><button class="btn" data-t="back">← Back</button></div>`;
    } else {
      const cards = [];
      for (let i = 1; i <= Save.SLOTS; i++) {
        const d = Save.read(i);
        if (!d) cards.push(`<div class="slot empty" data-t="new" data-n="${i}"><div class="sl-n">Slot ${i}</div><div class="sl-e">＋ New Game</div><div class="dim">Start a fresh journey</div></div>`);
        else {
          const t = Math.floor(d.playTime / 3600) + 'h ' + Math.floor(d.playTime % 3600 / 60) + 'm';
          const tool = (d.tools || []).find(x => x.uid === d.equipped);
          cards.push(`<div class="slot" data-t="load" data-n="${i}"><div class="sl-n">Slot ${i}</div>
            ${tool ? `<img class="sl-tool" src="${toolIcon(tool)}">` : ''}
            <div class="sl-st">Stage ${d.stage}: ${STAGES[d.stage - 1].name}</div>
            <div class="sl-row">⭐ Level ${d.level} · 🪙 ${fmt(d.coins)}</div>
            <div class="sl-row">🌳 ${fmt(d.chopped)} trees · 🐾 ${Object.keys(d.best || {}).length} species</div>
            <div class="sl-row dim">⏱ ${t} · saved ${new Date(d.saved).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</div>
            <button class="btn red sm sl-del" data-t="del" data-n="${i}">Delete</button></div>`);
        }
      }
      el.innerHTML = `${logo}<div class="slots">${cards.join('')}</div><div class="tmenu trow"><button class="btn" data-t="back">← Back</button></div>`;
    }
  },
  click(e) {
    const b = e.target.closest('[data-t]'); if (!b) return;
    const t = b.dataset.t, n = +b.dataset.n;
    SFX.ensure(); SFX.blip();
    if (t === 'play') { this.view = 'slots'; this.render(); }
    else if (t === 'back') { this.view = 'main'; this.render(); }
    else if (t === 'notes') Notes.show();
    else if (t === 'help') { this.view = 'help'; this.render(); }
    else if (t === 'del') { e.stopPropagation(); if (confirm(`Delete Slot ${n}? This can't be undone.`)) { Save.del(n); this.render(); } }
    else if (t === 'new') { this.hide(); S = newSaveData(n); Cine.play(() => { S.introSeen = true; startGame(S); Save.write(true); }); }
    else if (t === 'load') { const d = Save.read(n); if (!d) return; this.hide(); startGame(migrate(d)); UI.feed(`Welcome back! Loaded Slot ${n}.`); }
  },
};
let titleScene = null;
function drawTitleScene(dt) {

  function section(id, title, img, body) { return `<section id="pn-${id}"><h2>${title}</h2>${img ? `<figure><img src="${imgs[img]}" alt=""><figcaption>${title}</figcaption></figure>` : ''}${body}</section>`; }
  function html() {

      ['upg', '⬆ Upgrades & Attachments', 'Sharpen, balance and fit 14 attachments to your tools, plus 10 camp upgrades.'],

      ['saves', '💾 Save Slots', 'Three save slots with autosave every 30 seconds.'],
    ];
    const ul = (a) => `<ul>${a.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return `<div class="pn-wrap">
      <header class="pn-hero"><img src="${imgs.hero}" alt=""><div class="pn-hero-t"><div class="pn-k">PATCH NOTES</div><h1>Treasure Logs — ${GAME_VERSION}</h1><div class="pn-sub">The First Swing · Initial release</div></div></header>
      <p class="lead">Welcome to <b>Treasure Logs</b>! Grab Grandpa's old axe, clear the forest, and discover what's hidden inside the logs. This first update brings the entire foundation of the game — here's everything that's in it.</p>
      <h2 class="ov">Overview</h2>
      <div class="ovlist">${overview.map(([id, t, d]) => `<a class="ovi" data-jump="${id}"><b>${t}</b><span>${d}</span></a>`).join('')}</div>
      <h2 class="ov">Main Features</h2>
      ${section('story', '📖 Opening Story', null, `<p>Starting a new save plays a short cinematic: the tale of <b>Old Bram Ashvale</b>, the finest lumberjack the Timberdeep ever knew, and the letter he left behind — <i>"The old trees hide treasure."</i></p>${ul(['Six animated scenes with typewriter narration', 'Press Space/Enter or click to move on, Escape to skip', 'Ends with you arriving at Greenwood Glade, where Hilda is waiting'])}`)}
      ${section('forest', '🌳 The Forest', 'hero', `<p>The world is a large grassy forest you can walk around freely. In the middle is <b>the Camp</b>, home to the Blacksmith, Merchant, Ranger Hut, Hunter's Lodge and a Notice Board (that's where these notes live!).</p>${ul(['Ponds, dirt paths, flowers, bushes and a crackling campfire', 'The forest\'s look changes as you unlock each new stage — petals, fog, embers, snow and crystals', 'Minimap in the corner shows trees, saplings, acorns, chests and animals', 'Trees you walk behind turn see-through so you never lose your lumberjack'])}`)}
      ${section('chop', '🪓 Chopping & Respawning', 'chop', `<p>You start with <b>1 tree</b> on the map and a rusty axe. Walk up and click (or hold Space) to swing. Each tree has health, and breaking it drops logs you can sell to Pip.</p>${ul(['Broken trees go on a <b>10 second cooldown</b>, then respawn <b>somewhere random</b> on the map — a sapling with a timer ring shows where', 'Buy <b>More Trees</b> from Pip to have up to 15 trees growing at once', '<b>Hardness</b>: stronger trees need a stronger blade, or you only do 30% damage', 'Critical hits, damage numbers, wood chips and falling leaves', 'Foraging Levels (up to 60) — each level gives +2% damage'])}`)}
      ${section('acorn', '🌰 Growth Acorns', 'acorn', `<p>Glowing <b>Growth Acorns</b> pop up around the forest. Walk over one to put it in your pouch (holds 10), then press <b>R</b> to use it.</p>${ul(['Each acorn takes 4 seconds off <b>every</b> growing tree\'s respawn timer', 'Acorn Magnet upgrade gives more acorns and more seconds per acorn', 'Squirrels, the Seed Pouch attachment and Acorn Shower events help too'])}`)}
      ${section('craft', '🔨 Tool Crafting', 'craft', `<p>Every axe is made of three parts: a <b>Handle</b>, a <b>Binder</b> (the bit that joins blade to handle) and a <b>Blade</b>. Craft them together on Hilda's <b>Workbench</b>.</p>${ul(['Parts work like a collection — <b>own a part once and you have it forever</b>, use it in as many tools as you want', 'Handles are bought from Pip; blades and binders are forged by Hilda using coins + logs', '<b>Linear progression</b>: each tier needs the previous one first (Rusty → Copper → Iron → Steel → Silversteel → Mithril → Obsidian → Adamant)', 'Save multiple crafted tools on your <b>Tool Rack</b> (3 slots, upgradable to 15) and name them', 'Swap tools any time with keys 1–5', '10 special ★ parts that can <b>only</b> be found by chopping certain trees, each with a unique bonus'])}`)}
      ${section('saw', '🪚 Chainsaws', 'saw', `<p>Around the middle of the game (<b>Level ${MECHANIC.level}</b> and <b>Stage ${MECHANIC.stage}</b>), Hilda offers to build a <b>Mechanic's Bench</b>. Once built, you can craft chainsaws!</p>${ul(['Chainsaws use their own parts: <b>Engine</b> (Pip), <b>Guide Bar</b> and <b>Chain</b> (Hilda)', 'Hold to cut continuously — much higher damage per second', 'Free starter set when the bench is built: Sputter 2-Stroke, Short Guide Bar, Basic Chain', '6 engines, 6 bars, 5 chains plus 3 rare tree-drop chainsaw parts', '3 attachment slots (axes have 2) and 3 chainsaw-only attachments'])}`)}
      ${section('upg', '⬆ Upgrades & Attachments', 'upg', `<p>Hilda can improve any saved tool, and Pip sells camp-wide upgrades.</p>${ul(['<b>Sharpen</b> (+8% damage per level) and <b>Balance</b> (+4% speed per level), 10 levels each, per tool', '<b>14 attachments</b> — Leather Grip, Whetstone Edge, Sap Funnel, Hunter\'s Hook, Lucky Clover Charm, Seed Pouch, Golden Gild, Rune of Fury, Diamond Grinder and more. Buy once, fit on any tool', '<b>10 camp upgrades</b> from Pip: More Trees, Green Thumb, Timber Haggler, Swift Boots, Acorn Magnet, Keen Eye, Lucky Stars, Bigger Tool Rack, Pet Kennel, Hearty Stew'])}`)}
      ${section('stages', '🗺 Permits & Stages', 'stages', `<p>You can chop Oak for free, but every other tree needs a <b>permit</b> from Warden Elm. Tick or untick permits to choose which trees grow.</p>${ul(['<b>8 stages</b>: Greenwood Glade → Pinewood Trail → Blossom Hollow → Misty Marsh → Ancient Grove → Ember Wilds → Frostpeak Forest → Crystal Reach', 'Chop a certain number of trees to unlock the next stage (40, 130, 300, 600, 1,000, 1,600, 2,500)', '<b>16 tree types</b> with their own logs, health, hardness and value — from Oak and Birch up to Crystalwood and Starwood', 'Each stage brings new trees, new animals and a new look for the forest'])}`)}
      ${section('events', '🎲 Random Events', 'events', `<p>Every tree you chop has a chance to trigger something special.</p>${ul(['<b>Treasure Chest</b> — a chest falls out of the log, full of coins (and sometimes treats or acorns)', '<b>Golden Logs</b> — bonus logs', '<b>Sap Surge</b> — double damage for 20s', '<b>Lumber Frenzy</b> — +50% swing speed for 20s', '<b>Acorn Shower</b> — 3 Growth Acorns scattered nearby', '<b>Golden Tree</b> — a golden tree sprouts that drops 8× logs', '<b>Animal Den</b> — a whole family of animals bursts out', '<b>RARE DROP!</b> — special tool parts only found in specific trees'])}`)}
      ${section('hunt', '🏹 Hunting & the Bestiary', 'hunt', `<p>When a tree falls, an animal might run out of it. Swing at it to hunt it! Some flee, some wander and some — like Boars, Badgers, Wolves and Bears — fight back.</p>${ul(['<b>20 animals</b>, from Rabbits and Squirrels to the Crystal Stag, Spirit Owl and the ultra-rare <b>Golden Boar</b>', 'Every animal has its own <b>ability</b> that buffs foraging or hunting (speed, damage, crit, log value, XP, acorns…)', 'Abilities level up at 1 / 5 / 15 / 35 / 75 hunted — up to Level V', 'The <b>Bestiary</b> (press B) shows every animal you\'ve unlocked, its ability, and how many more you need for the next level', 'Health, regen and fainting — get knocked out and you drop 10% of your unsold logs'])}`)}
      ${section('pets', '🐾 Pets', 'pets', `<p>Animals with a 🐾 paw mark can be <b>tamed</b>. Buy Treats from Pip, walk up to the animal and press <b>F</b>. Weakening it first improves your chances.</p>${ul(['10 tameable species: Squirrel, Fox, Owl, Beaver, Woodpecker, Raccoon, Bear, Ember Salamander, Frost Fox, Spirit Owl', 'Pets roll a rarity: Common, Uncommon, Rare, Epic or Legendary', 'Active pets follow you and <b>chop nearby trees</b> on their own', 'Pets level up as they help (up to Level 25)', 'Start with 1 pet slot; the Pet Kennel upgrade gives up to 3'])}`)}
      ${section('npc', '💬 Characters & Dialogue', 'npc', `<p>Meet the camp! All conversations use a Stardew Valley-style dialogue box, with a character portrait, a name plate and choices you can click or pick with the arrow keys.</p>${ul(['<b>Hilda</b> — Blacksmith: workbench, tool upgrades, forging, attachments, Mechanic\'s Bench', '<b>Pip</b> — Merchant: sells logs, camp upgrades, handles, engines and treats', '<b>Warden Elm</b> — Ranger: tree permits and stages', '<b>Rowan</b> — Hunter: Bestiary and pets', 'A short tutorial quest line walks you through your first axe, sale, upgrade, permit and craft'])}`)}
      ${section('saves', '💾 Save Slots', 'saves', `<p>Pick one of <b>3 save slots</b> from the title screen. Each slot shows your stage, level, coins, trees chopped and play time.</p>${ul(['Autosaves every 30 seconds', 'Save manually or Save & Quit from the pause menu (Esc)', 'Delete a slot from the title screen'])}`)}
      <h2 class="ov">Other Changes</h2>
      ${ul(['Added a sound effects synthesizer — chops, crits, coins, level-ups and more (toggle in the pause menu)', 'Added floating damage numbers and log pickups with log icons', 'Added an objective tracker at the top of the screen', 'Added the Inventory (I): logs, part collection, all your stats and lifetime stats', 'Added hover tooltips for parts in the Workbench and Part Collection', 'Added stage-unlock banners and Hypixel-style RARE DROP / LEVEL UP pop-ups', 'Added these patch notes to the Notice Board in camp (press N anywhere)'])}
      <h2 class="ov">Controls</h2>

      <p class="sign">Happy chopping! 🌲</p></div>`;
  }
  function show() {
    if (!imgs) imgs = makeImgs();
    open = true; const el = $('#notes'); el.classList.remove('hidden');
    el.innerHTML = `<button class="pn-close btn" data-nx="1">✕ Close</button><div class="pn-scroll">${html()}</div>`;
    el.querySelector('.pn-scroll').scrollTop = 0;
  }
  function close() { open = false; $('#notes').classList.add('hidden'); }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-nx]')) close();
    const j = e.target.closest('[data-jump]'); if (j) { const s = document.getElementById('pn-' + j.dataset.jump); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
  return { show, close, get open() { return open; } };
})();

// ================= TREASURE LOGS — BOOT & LOOP =================
function resize() {
  VIEW.dpr = Math.min(2, window.devicePixelRatio || 1);
  VIEW.w = innerWidth; VIEW.h = innerHeight;
  canvas.width = VIEW.w * VIEW.dpr; canvas.height = VIEW.h * VIEW.dpr;
  canvas.style.width = VIEW.w + 'px'; canvas.style.height = VIEW.h + 'px';
  VIEW.zoom = Math.max(0.7, Math.min(1.35, Math.min(VIEW.w / 1150, VIEW.h / 760)));
  if (Cine.active) Cine.size();
}
window.addEventListener('resize', resize);

function startGame(data) {
  S = data; initWorld(); GAME_RUNNING = true;
  $('#hud').classList.remove('hidden');
  UI.refreshHUD();
  if (S.quest === 0) { UI.feed('📜 Objective: ' + QUESTS[0] + ' — walk over and press E.'); }
}

window.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code) && !(e.target && e.target.tagName === 'INPUT')) e.preventDefault();
  SFX.ensure();
  if (Title.open && !Notes.open) { return; }
  if (!e.repeat && UI.onKey(e)) { keys[e.code] = false; return; }
  if (UI.isBlocking()) return;
  keys[e.code] = true;
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
canvas.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.wx = cam.x + e.clientX / VIEW.zoom; mouse.wy = cam.y + e.clientY / VIEW.zoom; });
canvas.addEventListener('mousedown', (e) => { SFX.ensure(); if (e.button === 0 && GAME_RUNNING && !UI.isBlocking()) { mouse.down = true; mouse.wx = cam.x + e.clientX / VIEW.zoom; mouse.wy = cam.y + e.clientY / VIEW.zoom; } });
window.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
$('#title').addEventListener('click', (e) => Title.click(e));
$('#cine').addEventListener('click', () => Cine.next());
$('#cine-skip').addEventListener('click', (e) => { e.stopPropagation(); Cine.next(true); });
window.addEventListener('beforeunload', () => { if (GAME_RUNNING && S) Save.write(true); });

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try {
    if (Cine.active) Cine.tick(dt);
    else if (GAME_RUNNING) { update(dt); render(); UI.tickDialogue(dt); UI.tickBanners(dt); }
    else drawTitleScene(dt);
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
resize(); UI.init(); Title.show();
requestAnimationFrame(loop);

</script>
